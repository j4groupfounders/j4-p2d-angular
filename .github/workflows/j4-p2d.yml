name: J4 P2 batch 4 bounded verification
on:
  push:
    branches: ['j4/p2d-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Project tests
        run: |
          set -o pipefail
          npx nx test conduit | tee test-output.log
      - name: Component characterization
        run: npx vitest run --config apps/conduit/vite.config.mts apps/conduit/src/app/j4.characterize.spec.ts
      - name: Build
        run: npx nx build conduit --configuration=production
      - name: Boot and characterize
        run: python3 j4_stage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            test-output.log
            surface.actual.json
            components.actual.json
            http-evidence/**
            seed-results.json
            seed-evidence/
          retention-days: 30
